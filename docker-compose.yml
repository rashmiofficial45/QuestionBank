services:
  database:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: question_bank
      POSTGRES_USER: question_bank
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local database password in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U question_bank -d question_bank"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - postgres_data:/var/lib/postgresql
  migrate:
    build: .
    command: ["pnpm", "db:migrate"]
    environment:
      DATABASE_URL: ${COMPOSE_DATABASE_URL:?Set COMPOSE_DATABASE_URL in .env}
    depends_on:
      database:
        condition: service_healthy
  web:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: ${COMPOSE_DATABASE_URL:?Set COMPOSE_DATABASE_URL in .env}
      ENABLE_PRIVATE_ADMIN: "1"
      STORAGE_DIR: /data
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - source_files:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 4
    depends_on:
      migrate:
        condition: service_completed_successfully
  worker:
    build: ./worker
    restart: unless-stopped
    stop_grace_period: 3m
    mem_limit: 1g
    environment:
      DATABASE_URL: ${COMPOSE_DATABASE_URL:?Set COMPOSE_DATABASE_URL in .env}
      STORAGE_DIR: /data
    volumes:
      - source_files:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  postgres_data:
  source_files:
